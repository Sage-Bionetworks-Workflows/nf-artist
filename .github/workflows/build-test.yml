name: Docker Build Test

on:
  workflow_call:
    outputs:
      image:
        description: Tag of the built image, loadable from the nf-artist-image artifact
        value: ${{ jobs.build-and-test.outputs.image }}
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      IMAGE: nf-artist:ci-${{ github.sha }}

    outputs:
      image: ${{ env.IMAGE }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /tmp "$IMAGE" bash /repo/tests/smoke_test.sh

      - name: Save image
        run: docker save "$IMAGE" | gzip > /tmp/nf-artist-image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: nf-artist-image
          path: /tmp/nf-artist-image.tar.gz
          retention-days: 1
          compression-level: 0
