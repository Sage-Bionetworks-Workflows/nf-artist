name: Docker Build Test

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docker/**'
      - 'tests/**'
      - '.github/workflows/build-test.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      IMAGE: nf-artist:pr-${{ github.event.pull_request.number }}
      # main.nf predates the strict syntax parser (default since Nextflow 25.10)
      NXF_SYNTAX_PARSER: v1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /tmp "$IMAGE" bash /repo/tests/smoke_test.sh

      - uses: nf-core/setup-nextflow@v1

      - name: Run pipeline test profile with PR image
        run: |
          echo "process.container = '$IMAGE'" > pr-image.config
          nextflow run ${GITHUB_WORKSPACE} -profile test -c pr-image.config
