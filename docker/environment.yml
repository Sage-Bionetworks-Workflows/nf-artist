name: artist
channels:
  - conda-forge
  - ome
  - fastai
  - bioconda
dependencies:
  - python=3.12
  # numpy>=2.4 breaks optimagic imports (used by miniature via estimagic)
  - numpy>=2,<2.4
  # zarr 3 breaks minerva-author (zarr.core.Array, group item assignment)
  - zarr>=2.18.3,<3
  - Pillow
  - flask
  - waitress
  - flask_cors
  - matplotlib
  # tifffile>=2025.5.21 requires zarr 3 for aszarr(); 2025.x also drops
  # TIFF.RESUNIT, which tiffslide 2.1.2 uses
  - tifffile=2024.12.12
  - imagecodecs
  - scikit-image
  - pandas
  - pooch
  - cython
  - pyinstaller
  - altair
  - umap-learn
  - scikit-learn
  - colormath
  - h5py
  - bioformats2raw=0.4.0
  - raw2ometiff
  - pip
  - imagemagick
  - tiffslide=2.1.2
  - libvips
  - estimagic
  - pyvips
  - pip:
      - openslide-python
      - opencv-python-headless
      - synapseclient
      - mantel
      - "ome_types>=0.4.2"
